<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XIV Guard Academy — Σύνδεση</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet">

<!-- ═══════════════════════════════════════════════
     FIREBASE CONFIG — αντικατάστησε με τα δικά σου
     ═══════════════════════════════════════════════ -->
<script type="module">
  import { initializeApp }          from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged }
                                    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp }
                                    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyDW2mGxX3qR92-RceG8k5OV3_HsNUuAvnk",
    authDomain:        "xiv-guard.firebaseapp.com",
    projectId:         "xiv-guard",
    storageBucket:     "xiv-guard.firebasestorage.app",
    messagingSenderId: "924156526350",
    appId:             "1:924156526350:web:8cf9188e4d7e8b9121e15f"
  };

  const ADMIN_EMAIL = "sbabaitis@gmail.com"; // το email σου ως admin

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db   = getFirestore(app);

  // ── Αν είσαι ήδη logged in, redirect ──────────────────────────────────────
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      showPage();
      return;
    }
    const snap = await getDoc(doc(db, 'users', user.uid));
    if (!snap.exists()) { showPage(); return; }
    const data = snap.data();
    if (data.status === 'approved') {
      if (user.email === ADMIN_EMAIL) {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'quiz.html';
      }
    } else {
      showPage();
      showStatus(data.status);
    }
  });

  function showPage(){
    document.getElementById('loading-gate').style.display = 'none';
    document.getElementById('main-card').style.display    = 'block';
    // Έλεγχος URL params για status μηνύματα
    const params = new URLSearchParams(window.location.search);
    const st = params.get('status');
    if(st) showStatus(st);
  }

  function showStatus(status){
    const el = document.getElementById('status-msg');
    if(status === 'pending'){
      el.className = 'status-box pending';
      el.textContent = '⏳ Ο λογαριασμός σου είναι σε αναμονή έγκρισης. Θα ενημερωθείς σύντομα.';
    } else if(status === 'disabled'){
      el.className = 'status-box disabled';
      el.textContent = '🚫 Ο λογαριασμός σου έχει απενεργοποιηθεί. Επικοινώνησε με τον διαχειριστή.';
    }
    el.style.display = 'block';
  }

  // ── Register ──────────────────────────────────────────────────────────────
  window.doRegister = async () => {
    const email    = document.getElementById('reg-email').value.trim();
    const pass     = document.getElementById('reg-pass').value;
    const pass2    = document.getElementById('reg-pass2').value;
    const errEl    = document.getElementById('reg-error');
    errEl.textContent = '';

    if(!email || !pass){ errEl.textContent = 'Συμπλήρωσε email και κωδικό.'; return; }
    if(pass.length < 6){ errEl.textContent = 'Ο κωδικός πρέπει να έχει τουλάχιστον 6 χαρακτήρες.'; return; }
    if(pass !== pass2){ errEl.textContent = 'Οι κωδικοί δεν ταιριάζουν.'; return; }

    const btn = document.getElementById('reg-btn');
    btn.disabled = true; btn.textContent = 'Εγγραφή...';

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, pass);
      // Αποθήκευση στο Firestore με status pending
      const isAdmin = email === ADMIN_EMAIL;
      await setDoc(doc(db, 'users', cred.user.uid), {
        email:     email,
        status:    isAdmin ? 'approved' : 'pending',
        isAdmin:   isAdmin,
        createdAt: serverTimestamp()
      });
      if(isAdmin){
        window.location.href = 'admin.html';
      } else {
        document.getElementById('reg-success').style.display = 'block';
        btn.textContent = 'Εγγραφή';
        btn.disabled = false;
      }
    } catch(e){
      btn.disabled = false; btn.textContent = 'Εγγραφή';
      errEl.textContent = translateError(e.code);
    }
  };

  // ── Login ─────────────────────────────────────────────────────────────────
  window.doLogin = async () => {
    const email = document.getElementById('login-email').value.trim();
    const pass  = document.getElementById('login-pass').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';

    if(!email || !pass){ errEl.textContent = 'Συμπλήρωσε email και κωδικό.'; return; }

    const btn = document.getElementById('login-btn');
    btn.disabled = true; btn.textContent = 'Σύνδεση...';

    try {
      const cred = await signInWithEmailAndPassword(auth, email, pass);
      const snap = await getDoc(doc(db, 'users', cred.user.uid));
      if(!snap.exists()){ errEl.textContent = 'Δεν βρέθηκε λογαριασμός.'; btn.disabled=false; btn.textContent='Σύνδεση'; return; }
      const data = snap.data();
      if(data.status === 'pending'){
        showStatus('pending');
        btn.disabled=false; btn.textContent='Σύνδεση';
      } else if(data.status === 'disabled'){
        showStatus('disabled');
        btn.disabled=false; btn.textContent='Σύνδεση';
      } else if(data.status === 'approved'){
        if(data.isAdmin || email === ADMIN_EMAIL){
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'quiz.html';
        }
      }
    } catch(e){
      btn.disabled=false; btn.textContent='Σύνδεση';
      errEl.textContent = translateError(e.code);
    }
  };

  function translateError(code){
    const map = {
      'auth/email-already-in-use': 'Αυτό το email χρησιμοποιείται ήδη.',
      'auth/invalid-email':        'Μη έγκυρο email.',
      'auth/user-not-found':       'Δεν βρέθηκε χρήστης με αυτό το email.',
      'auth/wrong-password':       'Λάθος κωδικός.',
      'auth/invalid-credential':   'Λάθος email ή κωδικός.',
      'auth/too-many-requests':    'Πάρα πολλές προσπάθειες. Δοκίμασε αργότερα.',
      'auth/weak-password':        'Ο κωδικός είναι πολύ αδύναμος (τουλάχιστον 6 χαρακτήρες).',
    };
    return map[code] || 'Σφάλμα: ' + code;
  }

  // ── Tab switching ─────────────────────────────────────────────────────────
  window.switchTab = (tab) => {
    document.getElementById('tab-login').classList.toggle('active', tab==='login');
    document.getElementById('tab-reg').classList.toggle('active', tab==='register');
    document.getElementById('panel-login').style.display    = tab==='login'    ? 'block' : 'none';
    document.getElementById('panel-register').style.display = tab==='register' ? 'block' : 'none';
    document.getElementById('status-msg').style.display     = 'none';
  };

  // Enter key support
  window.addEventListener('keydown', e => {
    if(e.key !== 'Enter') return;
    const loginPanel = document.getElementById('panel-login');
    const regPanel   = document.getElementById('panel-register');
    if(loginPanel.style.display !== 'none') doLogin();
    else doRegister();
  });
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0b0d14;--surface:#13151f;--surface2:#1a1d2a;
  --border:#252838;--border2:#2e3248;
  --gold:#EF9F27;--gold2:#f5c842;--gold-dim:rgba(239,159,39,0.12);
  --text:#e8eaf2;--text2:#9aa0bc;--text3:#636880;
  --green:#3fb950;--red:#f85149;
  --radius:12px;--radius-sm:8px;
}
body{
  font-family:'Plus Jakarta Sans',system-ui,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:1.5rem;
  background-image:
    linear-gradient(rgba(239,159,39,0.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(239,159,39,0.025) 1px,transparent 1px);
  background-size:60px 60px;
}

/* Loading */
#loading-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;}
.spinner{width:38px;height:38px;border-radius:50%;border:3px solid rgba(239,159,39,0.15);border-top-color:var(--gold);animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Card */
#main-card{display:none;width:100%;max-width:420px;}

.logo-area{text-align:center;margin-bottom:2rem;}
.logo-area svg{filter:drop-shadow(0 0 24px rgba(239,159,39,0.15));}
.logo-title{font-family:'Lora',Georgia,serif;font-size:1.1rem;font-weight:700;color:var(--gold);margin-top:1rem;letter-spacing:0.04em;}
.logo-sub{font-size:0.72rem;color:var(--text3);margin-top:4px;letter-spacing:0.06em;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.5);}

/* Tabs */
.tabs{display:flex;border-bottom:1px solid var(--border);}
.tab{flex:1;padding:0.875rem;background:none;border:none;font-family:inherit;font-size:0.85rem;font-weight:600;color:var(--text3);cursor:pointer;transition:color 0.15s,background 0.15s;letter-spacing:0.02em;}
.tab.active{color:var(--gold);background:rgba(239,159,39,0.05);border-bottom:2px solid var(--gold);}
.tab:hover:not(.active){color:var(--text2);}

/* Panel */
.panel{padding:2rem;}
.field{margin-bottom:1.125rem;}
.field label{display:block;font-size:0.75rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:0.45rem;}
.field input{width:100%;background:var(--bg);border:1.5px solid var(--border2);border-radius:var(--radius-sm);padding:0.7rem 0.875rem;color:var(--text);font-family:inherit;font-size:0.92rem;transition:border-color 0.15s;}
.field input:focus{outline:none;border-color:var(--gold);}
.field input::placeholder{color:var(--text3);}

.submit-btn{width:100%;padding:0.875rem;background:var(--gold);color:#0b0d14;border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:0.95rem;font-weight:700;cursor:pointer;transition:background 0.15s;letter-spacing:0.02em;margin-top:0.375rem;}
.submit-btn:hover{background:var(--gold2);}
.submit-btn:disabled{opacity:0.6;cursor:default;}

.error-msg{font-size:0.78rem;color:var(--red);margin-top:0.625rem;min-height:1.1em;}

/* Status boxes */
.status-box{display:none;padding:0.875rem 1rem;border-radius:var(--radius-sm);font-size:0.82rem;font-weight:600;margin:0 2rem 1.5rem;line-height:1.5;}
.status-box.pending{background:rgba(239,159,39,0.08);border:1px solid rgba(239,159,39,0.3);color:var(--gold);}
.status-box.disabled{background:rgba(248,81,73,0.08);border:1px solid rgba(248,81,73,0.3);color:var(--red);}

/* Success */
#reg-success{display:none;background:rgba(63,185,80,0.08);border:1px solid rgba(63,185,80,0.3);border-radius:var(--radius-sm);padding:0.875rem;margin-top:1rem;font-size:0.82rem;color:var(--green);font-weight:600;text-align:center;line-height:1.6;}

.divider{height:1px;background:var(--border);margin:1.25rem 0;}
.hint{font-size:0.72rem;color:var(--text3);text-align:center;line-height:1.7;}

/* Footer */
.footer{text-align:center;margin-top:1.5rem;font-size:0.65rem;color:var(--text3);letter-spacing:0.05em;}
</style>
</head>
<body>

<!-- Loading spinner -->
<div id="loading-gate"><div class="spinner"></div></div>

<!-- Main card -->
<div id="main-card">

  <!-- Logo -->
  <div class="logo-area">
    <svg width="120" height="120" viewBox="190 20 300 280" xmlns="http://www.w3.org/2000/svg">
      <rect x="190" y="20" width="300" height="280" rx="10" fill="#0b0d14"/>
      <ellipse cx="340" cy="148" rx="140" ry="130" fill="url(#glow-idx)"/>
      <defs>
        <radialGradient id="glow-idx" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#3730a3" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="#080c18" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g transform="translate(340,130)">
        <polygon points="0,-72 62,-36 62,36 0,72 -62,36 -62,-36" fill="#0d1230" stroke="#EF9F27" stroke-width="1.5"/>
        <circle cx="0" cy="-30" r="5" fill="#EF9F27"/><circle cx="-26" cy="6" r="5" fill="#EF9F27"/>
        <circle cx="26" cy="6" r="5" fill="#EF9F27"/><circle cx="0" cy="28" r="5" fill="#FAC775"/>
        <line x1="0" y1="-25" x2="-22" y2="4" stroke="#EF9F27" stroke-width="1" opacity="0.7"/>
        <line x1="0" y1="-25" x2="22" y2="4" stroke="#EF9F27" stroke-width="1" opacity="0.7"/>
        <line x1="-22" y1="4" x2="22" y2="4" stroke="#EF9F27" stroke-width="1" opacity="0.7"/>
        <line x1="-22" y1="4" x2="0" y2="25" stroke="#FAC775" stroke-width="1" opacity="0.7"/>
        <line x1="22" y1="4" x2="0" y2="25" stroke="#FAC775" stroke-width="1" opacity="0.7"/>
      </g>
      <text x="340" y="232" text-anchor="middle" font-size="20" letter-spacing="4">
        <tspan font-family="'Cinzel',Georgia,serif" font-weight="700" fill="#FFFFFF">XIV </tspan>
        <tspan font-family="'Inter',sans-serif" font-weight="700" fill="#EF9F27">GUARD</tspan>
      </text>
      <text x="340" y="252" text-anchor="middle" font-family="'Inter',sans-serif" font-size="8" font-weight="400" letter-spacing="5" fill="#8890B5">ACADEMY</text>
    </svg>
    <div class="logo-title">XIV Guard Academy</div>
    <div class="logo-sub">ΠΛΑΤΦΟΡΜΑ ΠΙΣΤΟΠΟΙΗΣΗΣ ΙΑΑ</div>
  </div>

  <!-- Status message (pending/disabled) -->
  <div id="status-msg" class="status-box"></div>

  <!-- Card -->
  <div class="card">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Σύνδεση</button>
      <button class="tab" id="tab-reg" onclick="switchTab('register')">Εγγραφή</button>
    </div>

    <!-- Login Panel -->
    <div id="panel-login" class="panel">
      <div class="field">
        <label>Email</label>
        <input id="login-email" type="email" placeholder="example@email.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Κωδικός</label>
        <input id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="submit-btn" id="login-btn" onclick="doLogin()">Σύνδεση →</button>
      <div class="error-msg" id="login-error"></div>
    </div>

    <!-- Register Panel -->
    <div id="panel-register" class="panel" style="display:none;">
      <div class="field">
        <label>Email</label>
        <input id="reg-email" type="email" placeholder="example@email.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Κωδικός</label>
        <input id="reg-pass" type="password" placeholder="Τουλάχιστον 6 χαρακτήρες" autocomplete="new-password"/>
      </div>
      <div class="field">
        <label>Επανάληψη Κωδικού</label>
        <input id="reg-pass2" type="password" placeholder="Ίδιος κωδικός" autocomplete="new-password"/>
      </div>
      <button class="submit-btn" id="reg-btn" onclick="doRegister()">Εγγραφή</button>
      <div class="error-msg" id="reg-error"></div>
      <div id="reg-success">
        ✅ Ο λογαριασμός σου δημιουργήθηκε!<br>
        Αναμένεις έγκριση από τον διαχειριστή.<br>
        Θα μπορέσεις να συνδεθείς μόλις εγκριθείς.
      </div>
      <div class="divider"></div>
      <div class="hint">Η πρόσβαση χορηγείται μόνο μετά από έγκριση<br>του διαχειριστή.</div>
    </div>
  </div>

  <div class="footer">XIV GUARD ACADEMY &nbsp;·&nbsp; ΕΟΠΠΕΠ ΙΑΑ &nbsp;·&nbsp; 2025</div>
</div>

</body>
</html>
