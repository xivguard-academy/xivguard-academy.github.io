<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XIV Guard Academy — Τεστ Προσομοίωσης</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0b0d14;--surface:#13151f;--surface2:#1a1d2a;
  --border:#252838;--border2:#2e3248;
  --gold:#EF9F27;--gold2:#f5c842;--gold-dim:rgba(239,159,39,0.12);
  --text:#e8eaf2;--text2:#9aa0bc;--text3:#636880;
  --green:#3fb950;--red:#f85149;--blue:#58a6ff;
  --radius:12px;--radius-sm:8px;
}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;
  background-image:linear-gradient(rgba(239,159,39,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(239,159,39,0.015) 1px,transparent 1px);
  background-size:60px 60px;}

/* Loading */
#loading-gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;}
.spinner{width:38px;height:38px;border-radius:50%;border:3px solid rgba(239,159,39,0.15);border-top-color:var(--gold);animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#app{display:none;}

/* Timer Bar */
#timer-bar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:0.5rem 1.5rem;
  display:none;align-items:center;gap:1.25rem;
  box-shadow:0 2px 12px rgba(0,0,0,0.3);
}
.timer-track{flex:1;height:6px;background:var(--border2);border-radius:3px;overflow:hidden;}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:3px;transition:width 1s linear;}
.timer-fill.warn{background:linear-gradient(90deg,#f85149,#ff6b6b);}
#timer-display{font-size:1.1rem;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;min-width:60px;text-align:right;}
#timer-display.warn{color:var(--red);}
.timer-label{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);}
.timer-part{font-size:0.72rem;color:var(--text3);white-space:nowrap;}

/* Layout */
.wrap{max-width:720px;margin:0 auto;padding:1.5rem 1rem 4rem;}
.wrap.timer-offset{padding-top:4.5rem;}

/* Header */
.sim-header{background:var(--surface);border-bottom:1px solid var(--gold);padding:0.875rem 1.5rem;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 4px 24px rgba(239,159,39,0.08);position:sticky;top:0;z-index:100;}
.sim-header.with-timer{top:44px;}
.h-title{font-family:'Lora',Georgia,serif;font-size:0.9rem;font-weight:700;color:var(--gold);}
.h-sub{font-size:0.65rem;color:var(--text3);margin-top:2px;}
.h-badge{background:var(--gold-dim);border:1px solid rgba(239,159,39,0.3);border-radius:20px;
  padding:0.3rem 0.875rem;font-size:0.78rem;font-weight:700;color:var(--gold);}
.btn-home{background:transparent;border:1.5px solid var(--border2);border-radius:var(--radius-sm);
  padding:0.35rem 0.75rem;font-size:0.75rem;font-weight:600;color:var(--text3);cursor:pointer;font-family:inherit;}
.btn-home:hover{border-color:var(--red);color:var(--red);}

/* Progress bar (Part A) */
.prog-wrap{background:var(--surface);padding:0.4rem 1.5rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.875rem;}
.prog-bar{flex:1;height:4px;background:var(--border2);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;transition:width 0.4s ease;}
.prog-text{font-size:0.7rem;color:var(--text3);white-space:nowrap;font-weight:600;}

/* Intro screen */
.intro-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;text-align:center;margin-top:2rem;}
.intro-icon{font-size:3rem;margin-bottom:1.25rem;}
.intro-title{font-family:'Lora',Georgia,serif;font-size:1.4rem;font-weight:700;color:var(--gold);margin-bottom:0.5rem;}
.intro-sub{font-size:0.88rem;color:var(--text2);margin-bottom:2rem;line-height:1.7;}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0.75rem;margin-bottom:2rem;}
.info-box{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:1rem;text-align:center;}
.info-num{font-size:1.5rem;font-weight:800;color:var(--gold);font-family:'Lora',Georgia,serif;}
.info-lbl{font-size:0.7rem;color:var(--text3);margin-top:4px;line-height:1.4;}
.rules-box{background:rgba(239,159,39,0.05);border:1px solid rgba(239,159,39,0.2);border-radius:var(--radius-sm);padding:1.25rem;margin-bottom:2rem;text-align:left;}
.rules-title{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--gold);margin-bottom:0.75rem;}
.rules-list{list-style:none;display:flex;flex-direction:column;gap:0.5rem;}
.rules-list li{font-size:0.82rem;color:var(--text2);display:flex;gap:0.6rem;align-items:flex-start;line-height:1.5;}
.rules-list li::before{content:'›';color:var(--gold);font-weight:700;flex-shrink:0;}
.btn-start{padding:1rem 3rem;background:var(--gold);color:#0b0d14;border:none;border-radius:var(--radius);
  font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:0.03em;transition:background 0.15s;}
.btn-start:hover{background:var(--gold2);}

/* Question card */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;box-shadow:0 4px 20px rgba(0,0,0,0.35);animation:fadeUp 0.2s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.q-num{font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:var(--gold);margin-bottom:0.5rem;}
.q-part-label{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;
  color:var(--text3);margin-bottom:0.25rem;display:block;}
.q-text{font-family:'Lora',Georgia,serif;font-size:1rem;font-weight:600;color:var(--text);line-height:1.75;}
.options{display:flex;flex-direction:column;gap:0.55rem;margin-top:1.5rem;}
.opt{display:flex;align-items:flex-start;gap:0.875rem;padding:0.75rem 1rem;border:1.5px solid var(--border2);
  border-radius:10px;background:var(--bg);cursor:pointer;text-align:left;width:100%;
  transition:border-color 0.12s,background 0.12s;font-family:inherit;}
.opt:hover:not(:disabled):not(.correct):not(.wrong):not(.neutral){border-color:var(--gold);background:rgba(239,159,39,0.05);}
.opt:disabled{cursor:default;}
.opt-letter{width:26px;height:26px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border2);
  display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;color:var(--text3);flex-shrink:0;margin-top:1px;}
.opt-text{font-size:0.875rem;color:var(--text2);line-height:1.55;}
.opt.selected{border-color:var(--gold);background:rgba(239,159,39,0.08);}
.opt.selected .opt-letter{background:var(--gold);border-color:var(--gold);color:#0b0d14;}
.opt.selected .opt-text{color:var(--text);}
.opt.correct{border-color:var(--green);background:rgba(63,185,80,0.07);}
.opt.correct .opt-letter{background:var(--green);border-color:var(--green);color:#0b0d14;}
.opt.correct .opt-text{color:var(--green);}
.opt.wrong{border-color:var(--red);background:rgba(248,81,73,0.07);}
.opt.wrong .opt-letter{background:var(--red);border-color:var(--red);color:#fff;}
.opt.wrong .opt-text{color:var(--red);}
.opt.neutral{opacity:0.3;}
.action-row{display:flex;gap:0.625rem;margin-top:1rem;}
.btn-confirm{flex:1;padding:0.8rem;border:none;border-radius:10px;font-size:0.92rem;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-confirm:enabled{background:var(--gold);color:#0b0d14;}
.btn-confirm:enabled:hover{background:var(--gold2);}
.btn-confirm:disabled{background:var(--border2);color:var(--text3);cursor:not-allowed;}
.btn-skip{padding:0.8rem 1.2rem;background:transparent;border:1.5px solid var(--border2);border-radius:10px;
  font-size:0.8rem;font-weight:600;cursor:pointer;font-family:inherit;color:var(--text3);white-space:nowrap;
  transition:border-color 0.12s;}
.btn-skip:hover{border-color:#7c3aed;color:#9f67ff;}

/* Part A done / transition */
.transition-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;text-align:center;margin-top:2rem;animation:fadeUp 0.3s ease;}

/* Part B - practical */
.scenario-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.75rem;margin-bottom:1rem;animation:fadeUp 0.2s ease;}
.scenario-header{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--gold);margin-bottom:0.75rem;}
.scenario-text{font-family:'Lora',Georgia,serif;font-size:0.95rem;font-weight:600;color:var(--text);line-height:1.8;}
.checkbox-list{display:flex;flex-direction:column;gap:0.5rem;margin-top:1.5rem;}
.chk-opt{display:flex;align-items:flex-start;gap:0.875rem;padding:0.75rem 1rem;border:1.5px solid var(--border2);
  border-radius:10px;background:var(--bg);cursor:pointer;width:100%;text-align:left;transition:border-color 0.12s,background 0.12s;
  font-family:inherit;}
.chk-opt:hover:not(.chk-disabled):not(.chk-correct):not(.chk-wrong){border-color:var(--gold);background:rgba(239,159,39,0.05);}
.chk-opt.chk-selected{border-color:var(--gold);background:rgba(239,159,39,0.08);}
.chk-box{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--border2);background:var(--surface2);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.7rem;margin-top:1px;transition:all 0.12s;}
.chk-opt.chk-selected .chk-box{background:var(--gold);border-color:var(--gold);color:#0b0d14;}
.chk-opt.chk-correct{border-color:var(--green);background:rgba(63,185,80,0.07);}
.chk-opt.chk-correct .chk-box{background:var(--green);border-color:var(--green);color:#0b0d14;}
.chk-opt.chk-wrong{border-color:var(--red);background:rgba(248,81,73,0.07);}
.chk-opt.chk-wrong .chk-box{background:var(--red);border-color:var(--red);color:#fff;}
.chk-opt.chk-disabled{cursor:default;}
.chk-text{font-size:0.875rem;color:var(--text2);line-height:1.55;}
.chk-opt.chk-correct .chk-text{color:var(--green);}
.chk-opt.chk-wrong .chk-text{color:var(--red);}
.btn-submit{width:100%;padding:0.875rem;background:var(--gold);color:#0b0d14;border:none;border-radius:10px;
  font-size:0.95rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:1rem;transition:background 0.15s;}
.btn-submit:hover:not(:disabled){background:var(--gold2);}
.btn-submit:disabled{background:var(--border2);color:var(--text3);cursor:not-allowed;}
.btn-next{width:100%;padding:0.875rem;background:var(--surface2);color:var(--text);border:1.5px solid var(--border2);
  border-radius:10px;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:0.625rem;
  transition:border-color 0.15s;}
.btn-next:hover{border-color:var(--gold);color:var(--gold);}
.score-reveal{background:rgba(239,159,39,0.06);border:1px solid rgba(239,159,39,0.25);border-radius:var(--radius-sm);
  padding:1rem;margin-top:1rem;display:flex;align-items:center;gap:1rem;}
.score-num{font-size:1.8rem;font-weight:800;color:var(--gold);font-family:'Lora',Georgia,serif;flex-shrink:0;}
.score-detail{font-size:0.8rem;color:var(--text2);line-height:1.6;}

/* Results */
.results-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;text-align:center;margin-top:1.5rem;animation:fadeUp 0.3s ease;}
.res-icon{font-size:3rem;margin-bottom:0.875rem;}
.res-title{font-family:'Lora',Georgia,serif;font-size:1.35rem;font-weight:700;margin-bottom:0.25rem;}
.pass-badge{display:inline-block;padding:0.35rem 1.25rem;border-radius:20px;font-size:0.95rem;font-weight:700;margin:0.75rem 0 1.5rem;}
.pass-badge.pass{background:rgba(63,185,80,0.12);color:var(--green);border:1.5px solid rgba(63,185,80,0.4);}
.pass-badge.fail{background:rgba(248,81,73,0.1);color:var(--red);border:1.5px solid rgba(248,81,73,0.35);}
.res-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.75rem;margin-bottom:1.75rem;max-width:480px;margin-left:auto;margin-right:auto;}
.res-box{background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:1rem 0.75rem;}
.res-val{font-size:1.6rem;font-weight:800;font-family:'Lora',Georgia,serif;}
.res-lbl{font-size:0.65rem;color:var(--text3);margin-top:4px;text-transform:uppercase;letter-spacing:0.06em;}
.res-note{font-size:0.8rem;color:var(--text3);margin-bottom:2rem;line-height:1.7;}
.res-actions{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;}
.btn-again{padding:0.75rem 2rem;background:var(--gold);color:#0b0d14;border:none;border-radius:10px;font-size:0.9rem;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-again:hover{background:var(--gold2);}
.btn-home-res{padding:0.75rem 2rem;background:transparent;border:1.5px solid var(--border2);border-radius:10px;
  color:var(--text2);font-size:0.9rem;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;}
.btn-home-res:hover{border-color:var(--gold);color:var(--gold);}
.part-detail{background:rgba(239,159,39,0.04);border:1px solid rgba(239,159,39,0.15);border-radius:var(--radius-sm);
  padding:1rem 1.25rem;margin-bottom:1.25rem;text-align:left;}
.part-detail-title{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--gold);margin-bottom:0.625rem;}
.part-row{display:flex;justify-content:space-between;align-items:center;padding:0.3rem 0;font-size:0.82rem;color:var(--text2);}
.part-row .val{font-weight:700;color:var(--text);}

/* Utility */
.mt1{margin-top:1rem;} .mt2{margin-top:1.5rem;}
.section-label{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);margin-bottom:0.5rem;}
.warn-banner{background:rgba(248,81,73,0.08);border:1px solid rgba(248,81,73,0.3);border-radius:var(--radius-sm);
  padding:0.75rem 1rem;font-size:0.82rem;color:var(--red);font-weight:600;margin-bottom:1rem;}

@media(max-width:600px){
  .res-grid{grid-template-columns:1fr 1fr;}
  .info-grid{grid-template-columns:1fr 1fr;}
}
</style>
</head>
<body>

<div id="loading-gate"><div class="spinner"></div></div>

<div id="app">
  <!-- Timer Bar (fixed, shown during Part A) -->
  <div id="timer-bar" style="display:none;align-items:center;gap:1.25rem;">
    <div class="timer-label">⏱ ΘΕΩΡΗΤΙΚΟ ΜΕΡΟΣ</div>
    <div class="timer-track"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
    <div id="timer-display">60:00</div>
  </div>

  <!-- Header -->
  <header class="sim-header" id="sim-header">
    <div>
      <div class="h-title">XIV Guard Academy</div>
      <div class="h-sub">Τεστ Προσομοίωσης · ΕΟΠΠΕΠ</div>
    </div>
    <div style="display:flex;gap:0.75rem;align-items:center;">
      <span class="h-badge" id="phase-badge">Έναρξη</span>
      <button class="btn-home" onclick="goHome()">✕ Έξοδος</button>
    </div>
  </header>

  <!-- Progress bar (shown during Part A) -->
  <div class="prog-wrap" id="prog-bar-wrap" style="display:none;">
    <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:5%"></div></div>
    <span class="prog-text" id="prog-text">1 / 20</span>
  </div>

  <!-- Main content -->
  <div class="wrap" id="content-wrap">
    <div id="content"></div>
  </div>
</div>

<script type="module">
import { initializeApp }   from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, addDoc, collection, serverTimestamp }
        from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey:            "AIzaSyDW2mGxX3qR92-RceG8k5OV3_HsNUuAvnk",
  authDomain:        "xiv-guard.firebaseapp.com",
  projectId:         "xiv-guard",
  storageBucket:     "xiv-guard.firebasestorage.app",
  messagingSenderId: "924156526350",
  appId:             "1:924156526350:web:8cf9188e4d7e8b9121e15f"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);

let userId = null;
let userEmail = null;

onAuthStateChanged(auth, user => {
  if (!user) { window.location.href = 'index.html'; return; }
  userId = user.uid;
  userEmail = user.email;
  document.getElementById('loading-gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  render();
});


// ── Wrong answers for Practical Questions ────────────────────────────────────
const practicalWrong = {
  "Β1":["Επιτρέπεται η χρήση οποιασδήποτε στολής εφόσον φέρει εμφανές σήμα της εταιρείας.","Η χρήση της ένδειξης «Private Police» επιτρέπεται κατόπιν αδείας του Υπουργείου Δημόσιας Τάξης."],
  "Β2":["Η καταγραφή στοιχείων επισκεπτών είναι προαιρετική και εξαρτάται από τον εργοδότη.","Ο φύλακας εισόδου μπορεί να αγνοεί επισκέπτες που δεν παρουσιάζουν ύποπτη συμπεριφορά."],
  "Β3":["Το Προσωπικό Ιδιωτικής Ασφάλειας ανοίγει το χαρτοκιβώτιο για να επιβεβαιώσει αν περιέχει επικίνδυνο υλικό.","Το Προσωπικό Ιδιωτικής Ασφάλειας μεταφέρει το ύποπτο αντικείμενο σε ασφαλές απομακρυσμένο σημείο."],
  "Β4":["Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τα ΜΜΕ για αποτροπή περαιτέρω πανικού.","Το Προσωπικό Ιδιωτικής Ασφάλειας αναλαμβάνει αυτόνομα έρευνα για τον εντοπισμό της βόμβας."],
  "Β5":["Το Προσωπικό Ιδιωτικής Ασφάλειας υποχρεούται να φέρει πυροβόλο όπλο κατά τη διάρκεια κάθε περιπολίας.","Η σφυρίχτρα αντικαθίσταται υποχρεωτικά από ηλεκτρονική συσκευή προσωπικού συναγερμού."],
  "Β6":["Το Προσωπικό Ιδιωτικής Ασφάλειας αναλαμβάνει αμέσως καταδίωξη των δραστών που τράπηκαν σε φυγή.","Το Προσωπικό Ιδιωτικής Ασφάλειας απαγορεύει σε τυχόν μάρτυρες να επικοινωνήσουν με οποιονδήποτε."],
  "Β7":["Το Προσωπικό Ιδιωτικής Ασφάλειας εισέρχεται αμέσως στην οικία για αυτόνομο έλεγχο των εσωτερικών χώρων.","Το Προσωπικό Ιδιωτικής Ασφάλειας απενεργοποιεί τον συναγερμό χωρίς να ειδοποιήσει τον ιδιοκτήτη."],
  "Β8":["Το Προσωπικό Ιδιωτικής Ασφάλειας επιτρέπει την είσοδο χωρίς έλεγχο εφόσον ο επισκέπτης έχει ραντεβού.","Το Προσωπικό Ιδιωτικής Ασφάλειας διενεργεί τον έλεγχο αναγκαστικά, ανεξαρτήτως συναίνεσης."],

ary":""},{"id":"Α97","question":"Από τι αποτελείται, συνήθως, ένα σύστημα πυρανίχνευσης; (Επιλέξτε την πληρέστερη απάντηση).","options":["Τη μονάδα ελέγχου και τις συσκευές ανίχνευσης καπνού.","Τη μονάδα ελέγχου και τις σειρήνες πυρανίχνευσης.","Τη μονάδα ελέγχου, τις συσκευές ανίχνευσης καπνού, θερμότητας, τις σειρήνες πυρανίχνευσης, τα μπουτόν αναγγελίας φωτιάς και τους φωτεινούς επαναλήπτες.","Τις σειρήνες πυρανίχνευσης και τα μπουτόν αναγγελίας φωτιάς."],"correct":2,"summary":""},{"id":"Α98","question":"Το αλεξίσφαιρο γιλέκο είναι ένα ατομικό προστατευτικό μέσο που προστατεύει τον κορμό του ανθρώπινου σώματος από:","options":["Βλήματα πυροβόλων όπλων.","Μικρά θραύσματα εκρηκτικών, όπως χειροβομβίδες.","Μαχαίρια.","Όλα τα παραπάνω."],"correct":3,"summary":""},{"id":"Α99","question":"Η __________ προετοιμασία είναι το σύνολο όλων εκείνων των στοιχείων που πρέπει να έχει σχεδιάσει το Προσωπικό Ιδιωτικής Ασφάλειας, πριν την άσκηση των καθηκόντων του. Περιλαμβάνει τον τρόπο με τον οποίο ενεργοποιεί το μυαλό του, κατευθύνει τις σκέψεις του, πιθανολογεί, επιλύει προβλήματα και προσπαθεί να προβλέψει την εξέλιξη μιας επικίνδυνης κατάστασης.","options":["ψυχική","σωματική","διανοητική","ψυχοσωματική"],"correct":2,"summary":""},{"id":"Α100","question":"Τι οφείλει να κάνει το Προσωπικό Ιδιωτικής Ασφάλειας πριν την ανάληψη υπηρεσίας;","options":["Να είναι συγκεντρωμένο, προσηλωμένο στην αποστολή του, έτοιμο να εκτελέσει τα καθήκοντά του με επάρκεια και αποτελεσματικότητα.","Να έχει γευματίσει αμέσως πριν την ανάληψη υπηρεσίας, για την αποφυγή της πιθανότητας να περιέλθει σε κατάσταση πείνας κατά την εκτέλεση αυτής.","Να προσέρχεται κουρασμένος και να ασχολείται με αντικείμενα άσχετα με την υπηρεσία που εκτελεί (π.χ. απασχόληση στο κινητό τηλέφωνο, τάμπλετ, τηλεόραση).","Να ενημερώσει τον Αξιωματικό Υπηρεσίας του τοπικού Αστυνομικού Τμήματος και να συντάξει αναφορά ανάληψης υπηρεσίας.","Κανένα από τα παραπάνω."],"correct":0,"summary":""},{"id":"Α101","question":"Ποια μηνύματα που μεταδίδονται από το Προσωπικό Ιδιωτικής Ασφάλειας χαρακτηρίζονται ως Μέσης Προτεραιότητας;","options":["Τα μηνύματα που αφορούν έκτακτη ανάγκη.","Τα μηνύματα που αφορούν συμβάντα.","Τα μηνύματα που υπερτερούν κάθε άλλης μετάδοσης.","Τα μηνύματα που αφορούν ιδιωτικά ζητήματα του προσωπικού.","Όλα τα παραπάνω."],"correct":1,"summary":""},{"id":"Α102","question":"Ποια μηνύματα που μεταδίδονται από το Προσωπικό Ιδιωτικής Ασφάλειας χαρακτηρίζονται ως Απόλυτης Προτεραιότητας:","options":["Τα μηνύματα που αφορούν τη λήξη της υπηρεσίας.","Τα μηνύματα που αφορούν ιδιωτικά ζητήματα του προσωπικού.","Τα μηνύματα που αφορούν καθημερινά συμβάντα.","Τα μηνύματα που αφορούν την έναρξη της υπηρεσίας.","Τα μηνύματα που αφορούν έκτακτη ανάγκη."],"correct":4,"summary":""},{"id":"Α103","question":"Ποια συσκευή ραδιοτηλεφώνου (ασυρμάτου) χρησιμοποιείται ευρέως από το Προσωπικό Ιδιωτικής Ασφάλειας κατά την εκτέλεση των καθηκόντων του;","options":["Η φορητή μονάδα ραδιοτηλεφώνου (ασύρματος, walkie-talkie), δηλαδή η προσωπική συσκευή την οποία φέρει το Προσωπικό Ιδιωτικής Ασφάλειας.","Η κεντρική μονάδα που βρίσκεται σε διάφορες εγκαταστάσεις που φυλάσσονται από το Προσωπικό Ιδιωτικής Ασφάλειας.","Η σταθερή μονάδα που βρίσκεται στα οχήματα περιπολίας.","Η κεντρική μονάδα που βρίσκεται στα Κέντρα Λήψης Σημάτων.","Όλες οι παραπάνω."],"correct":0,"summary":""},{"id":"Α104","question":"Ποιους κανόνες πρέπει να ακολουθεί το Προσωπικό Ιδιωτικής Ασφάλειας που συντάσσει αναφορά για ένα συμβάν;","options":["Μπορεί να απευθύνεται σε οποιονδήποτε παραλήπτη, ακόμη και αν περιέχει εμπιστευτικές πληροφορίες.","Πρέπει να περιέχει την προσωπική γνώμη του Προσωπικού Ιδιωτικής Ασφάλειας για το συμβάν, καθώς και αξιολογικές κρίσεις για αυτό.","Πρέπει να απαντά με σαφήνεια στα ερωτήματα τι συνέβη, ποιος εμπλέκεται, πότε συνέβη, πού έλαβε και γιατί έλαβε χώρα το συμβάν, πώς περιήλθε σε γνώση του, καθώς και μέτρα που ελήφθησαν ή ενέργειες που εκδηλώθηκαν από μέρος του.","Όλα τα παραπάνω."],"correct":2,"summary":""},{"id":"Α105","question":"Πότε πρέπει το Προσωπικό Ιδιωτικής Ασφάλειας να συντάσσει αναφορά για ένα συμβάν που έλαβε χώρα;","options":["Το συντομότερο δυνατόν μετά το συμβάν.","Αρκετές ημέρες μετά το συμβάν.","Μόνο εάν λάβει σχετική εντολή από την Αστυνομία.","Δεν είναι στις αρμοδιότητές του να συντάσσει αναφορά για συμβάντα.","Κανένα από τα παραπάνω."],"correct":0,"summary":""},{"id":"Α106","question":"Σε ποιες ενέργειες πρέπει να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας, το οποίο εν ώρα υπηρεσίας, επιθυμεί, για έκτακτο λόγο, την αντικατάστασή του από έτερο συνάδελφό του;","options":["Να αποχωρήσει, χωρίς να ενημερώσει κανένα, αφού πρόκειται για έκτακτο λόγο.","Να αποχωρήσει και κατόπιν να ενημερώσει τον Αρχιφύλακα ή τον Επόπτη του και να λάβει σχετικές οδηγίες.","Να ενημερώσει προηγουμένως την Ελληνική Αστυνομία.","Να ενημερώσει προηγουμένως τον Αρχιφύλακα ή τον Επόπτη του και να λάβει σχετικές οδηγίες.","Κανένα από τα παραπάνω."],"correct":3,"summary":""},{"id":"Α107","question":"Το Προσωπικό Ιδιωτικής Ασφάλειας κατά τη χρήση ραδιοτηλεφώνου (ασυρμάτου):","options":["Αναφέρει τον κωδικό κλήσης του κατά την έναρξη της μετάδοσής του.","Μιλά με πολύ γρήγορη ροή, χωρίς να ακούει τις οδηγίες του Κέντρου Ελέγχου.","Συζητά προσωπικά θέματα, μόνο αν δεν υπάρχει φόρτος εργασίας.","Κανένα από τα παραπάνω."],"correct":0,"summary":""},{"id":"Α108","question":"Τι περιλαμβάνουν οι βασικές λειτουργίες των σύγχρονων Κέντρων Λήψης Σημάτων;","options":["Συστήματα συναγερμού εισβολής - παρείσφρησης - παράνομης εισόδου.","Συστήματα συναγερμού ομηρίας - ληστείας.","Συστήματα κλειστού κυκλώματος τηλεόρασης CCTV.","Συστήματα συναγερμού πυρκαγιάς.","Όλα τα παραπάνω."],"correct":4,"summary":""},{"id":"Α109","question":"Ποια είναι μία συνηθισμένη παράλειψη του Προσωπικού Ιδιωτικής Ασφάλειας κατά την εκτέλεση υπηρεσίας και την ανταπόκριση σε περιστατικά;","options":["Η παράλειψη συλλογής πειστήριων και ιχνών από τη σκηνή του εγκλήματος.","Η παράλειψη ενημέρωσης των Μέσων Μαζικής Ενημέρωσης (Μ.Μ.Ε.).","Η παράλειψη έγκαιρης ενημέρωσης των αρμοδίων δημοσίων Αρχών.","Κανένα από τα παραπάνω."],"correct":2,"summary":""},{"id":"Α110","question":"Η διαχείριση πλήθους σε αθλητικές διοργανώσεις:","options":["Δεν έχει καμία επιρροή στην ασφάλεια της εκδήλωσης, αφού ο κάθε θεατής γνωρίζει τη θέση του στις κερκίδες.","Δεν έχει καμία επιρροή στην ασφάλεια της εκδήλωσης, αφού όλα γίνονται αυτοματοποιημένα.","Επηρεάζει σε μεγάλο βαθμό την ασφάλεια και την επιτυχία της εκδήλωσης.","Δεν έχει καμία σχέση με τις αθλητικές διοργανώσεις."],"correct":2,"summary":""},{"id":"Α111","question":"Η τοποθέτηση των φιλάθλων στις κερκίδες των αθλητικών εγκαταστάσεων:","options":["Είναι αποκλειστική αρμοδιότητα της Ελληνικής Αστυνομίας.","Είναι στα καθήκοντα του Προσωπικού Ιδιωτικής Ασφάλειας που εκτελεί υπηρεσία στη συγκεκριμένη αθλητική εγκατάσταση.","Σε καμία περίπτωση δεν αποτελεί αρμοδιότητα του Προσωπικού Ιδιωτικής Ασφάλειας.","Κανένα από τα παραπάνω."],"correct":1,"summary":""},{"id":"Α112","question":"Πώς πρέπει να ενεργεί το Προσωπικό Ιδιωτικής Ασφάλειας κατά τη διάρκεια αθλητικής εκδήλωσης, εάν προκληθεί με υβριστικά συνθήματα και χειρονομίες;","options":["Να εμπλακεί σε διένεξη.","Να ανταποδώσει την πρόκληση και να ενημερώσει την Ελληνική Αστυνομία.","Να ανταποδώσει την πρόκληση και να ενημερώσει τον Υπεύθυνο Ασφάλειας.","Να μην ανταποκριθεί σε καμία πρόκληση, να διατηρήσει την ψυχραιμία του και να μην εμπλακεί σε διενέξεις, ώστε να μην δημιουργηθεί κρίση."],"correct":3,"summary":""},{"id":"Α113","question":"Μια μελέτη ασφάλειας, πρέπει να περιλαμβάνει:","options":["Την υφιστάμενη κατάσταση της εγκατάστασης.","Την εκτίμηση της επικινδυνότητας.","Τον προσδιορισμό της τρωτότητας - ευαλωτότητας.","Την πρόταση για ενδεχόμενη βελτίωση των υφιστάμενων μέτρων ασφάλειας.","Όλα τα παραπάνω."],"correct":4,"summary":""},{"id":"Α114","question":"«Υποδομές __________ Σημασίας» νοούνται τα περιουσιακά στοιχεία, συστήματα ή μέρη αυτών τα οποία είναι ουσιώδη για τη διατήρηση των λειτουργιών ζωτικής σημασίας της κοινωνίας, της υγείας, της ασφάλειας, της οικονομικής και κοινωνικής ευημερίας των μελών της, των οποίων η διακοπή λειτουργίας ή η καταστροφή θα είχε σημαντικό αντίκτυπο για τη χώρα, ως αποτέλεσμα αδυναμίας διατήρησης των λειτουργιών αυτών (πάνω από ένα προκαθορισμένο επίπεδο).","options":["Άνευ","Ζωτικής","Ευρωπαϊκής","Μικρής","Κανένα από τα παραπάνω."],"correct":1,"summary":""},{"id":"Α115","question":"Ποια είναι ορισμένα από τα περιστατικά τα οποία ενδέχεται να διαχειριστεί το Προσωπικό Ιδιωτικής Ασφάλειας κατά την παροχή υπηρεσιών ασφαλείας σε χερσαία Μέσα Μαζικής Μεταφοράς (Μ.Μ.Μ.);","options":["Διαχείριση τηλεφωνικής απειλής για τοποθέτηση βόμβας ή/και ανεύρεση ύποπτου αντικειμένου ή/και εκρηκτικού, εμπρηστικού μηχανισμού.","Αντιμετώπιση ατόμων που χρήζουν ειδικής αντιμετώπισης π.χ. οινόφλυγες, ψυχασθενείς.","Διαχείριση περιστατικών αυτοκτονίας.","Όλα τα παραπάνω."],"correct":3,"summary":""},{"id":"Α116","question":"Ποιο από τα παρακάτω αντικείμενα, με την επιφύλαξη των ισχυόντων κανόνων ασφάλειας πτήσης, δεν επιτρέπεται να φέρουν οι επιβάτες, σε αυστηρά ελεγχόμενη περιοχή ασφάλειας και στον θάλαμο αεροσκάφους.","options":["Ψαροντούφεκο.","Καμινέτο.","Ρόπαλο του μπέιζμπολ.","Πυροβόλο όπλο.","Όλα τα παραπάνω."],"correct":4,"summary":""},{"id":"Α117","question":"Ποιες από τις παρακάτω εγκαταστάσεις είναι εν δυνάμει πιθανοί στόχοι;","options":["Κρατικά κτήρια και λοιπές υπηρεσίες π.χ. υπουργεία, δήμοι, δικαστήρια, πανεπιστημιακά ιδρύματα κ.λπ..","Κτήρια πρεσβειών, διεθνών οργανισμών κ.λπ..","Αερολιμένες, λιμενικές εγκαταστάσεις, σταθμοί μετρό κ.λπ..","Υγειονομικοί φορείς π.χ. νοσοκομεία, κέντρα υγείας, ιδιωτικές κλινικές κ.λπ..","Όλα τα παραπάνω.."],"correct":4,"summary":""},{"id":"Α118","question":"Το ____________ αποτελεί εθνικό σημείο επαφής για την προστασία των Ευρωπαϊκών Υποδομών Ζωτικής Σημασίας (Ε.Υ.Ζ.Σ.) που βρίσκονται εντός της ελληνικής επικράτειας.","options":["Κεντρικό Συμβούλιο","Κέντρο Μελετών Ασφάλειας","Υπουργείο Π const practicalQuestions = [{"id":"Β1","question":"Εργάζεστε ως Προσωπικό Ιδιωτικής Ασφάλειας σε τράπεζα και κατά την εκτέλεση της υπηρεσίας σας φοράτε στολή χρώματος μαύρου στην οποία έχετε συρράψει διακριτικά που αναγράφουν «Ιδιωτική Αστυνομία - Private Police». Είναι η στολή αυτή κατάλληλη; Τι αναγράφεται στην κονκάρδα του Προσωπικού Ιδιωτικής Ασφάλειας;","options":["Η εν λόγω στολή δεν είναι σύμφωνη με τις διατάξεις του ν.2518/1997, γιατί η στολή του Προσωπικού Ιδιωτικής Ασφάλειας δεν πρέπει να αναγράφει τις λέξεις \"Αστυνομία\", \"Police\".","Το ειδικό διακριτικό σήμα (κονκάρδα) φέρεται στο αριστερό ημιθωράκιο του δικαιούχου.","Στο ειδικό διακριτικό σήμα (κονκάρδα) αναγράφεται η επωνυμία της επιχείρησης και το αρκτικόλεξο Ι.Ε.Π.Υ.Α..","Το ειδικό διακριτικό σήμα φέρει την ένδειξη PRIVATE SECURITY.","Το Προσωπικό Ιδιωτικής Ασφάλειας υποχρεούται να φέρει το δελτίο ταυτότητας και το ειδικό διακριτικό σήμα κατά την εκτέλεση των δραστηριοτήτων του."],"type":"flashcard"},{"id":"Β2","question":"Εργάζεστε ως Προσωπικό Ιδιωτικής Ασφάλειας σε μία εγκατάσταση και σας έχει ανατεθεί η φύλαξη της πύλης εισόδου της εγκατάστασης. Αυτή η θέση εργασίας αποτελεί το πρώτο σημείο επαφής με τους εργαζόμενους και τους επισκέπτες. Ποια πρέπει να είναι τα γενικά στοιχεία της «επαγγελματικής εικόνας» σας και ποια μπορεί να είναι ορισμένα από τα βασικά καθήκοντά σας, όταν εκτελείτε υπηρεσία στην κεντρική είσοδο - πύλη;","options":["Η επιμελημένη εξωτερική εμφάνιση.","Η ετοιμότητα και ο επαγγελματισμός κατά την εκτέλεση των καθηκόντων σας.","Ο αυτοέλεγχος και η αυτοσυγκράτηση.","Ο έλεγχος των εισερχόμενων ατόμων και οχημάτων.","Η καταγραφή σε βιβλίο των επισκεπτών και στοιχείων, όπως η ώρα άφιξής τους, το πρόσωπο ή τμήμα που πρόκειται να επισκεφθούν."],"type":"flashcard"},{"id":"Β3","question":"Εργάζεστε ως Προσωπικό Ιδιωτικής Ασφάλειας σε μια μεγάλη εγκατάσταση. Εκτελώντας πεζή περιπολία, νυχτερινές ώρες, στον περίβολο της εγκατάστασης, αντιλαμβάνεστε την ύπαρξη ενός χαρτοκιβωτίου τυλιγμένου με μονωτική ταινία, το οποίο είναι εγκαταλελειμμένο δίπλα στον περίβολο της εγκατάστασης και η ύπαρξη του εκεί δεν δικαιολογείται. Ποιες είναι ορισμένες από τις ενέργειες που δύναται να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας δεν αγγίζει το ύποπτο αντικείμενο.","Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τον προϊστάμενό του ή το Κέντρο Ελέγχου και την Ελληνική Αστυνομία.","Το Προσωπικό Ιδιωτικής Ασφάλειας διατηρεί ικανή απόσταση από το χαρτοκιβώτιο.","Το Προσωπικό Ιδιωτικής Ασφάλειας καλύπτεται πίσω απο τυχόν υπάρχοντα εμπόδια (π.χ. τοιχίο, κολώνα κ.λπ.).","Το Προσωπικό Ιδιωτικής Ασφάλειας θα πρέπει να διατηρήσει την ψυχραιμία του και σε καμία περίπτωση να μην πανικοβληθεί."],"type":"flashcard"},{"id":"Β4","question":"Εργάζεστε ως Προσωπικό Ιδιωτικής Ασφάλειας και παρέχετε υπηρεσία φύλαξης σε μεγάλο εμπορικό κέντρο. Κατά την εκτέλεση της υπηρεσίας σας δέχεστε απειλητικό τηλεφώνημα από άγνωστο άτομο για τοποθέτηση βόμβας στο εμπορικό κέντρο. Ποιες είναι ορισμένες από τις ενέργειες που δύναται να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τον προϊστάμενό του ή το Κέντρο Ελέγχου και την Ελληνική Αστυνομία, την Πυροσβεστική Υπηρεσία ή άλλες αρμόδιες Αρχές.","Το Προσωπικό Ιδιωτικής Ασφάλειας θα πρέπει να λάβει άμεσα μέτρα αυτοπροστασίας.","Σε περίπτωση εντοπισμού της βόμβας, σε καμία περίπτωση δεν την επεξεργάζεται.","Το Προσωπικό Ιδιωτικής Ασφάλειας θα πρέπει να προσπαθήσει να θέσει στο άτομο που το απειλεί, με ηρεμία, ερωτήματα όπως: Πότε πρόκειται να εκραγεί η βόμβα; Πού τοποθετήθηκε η βόμβα; Πότε τοποθετήθηκε εκεί; Πώς είναι η βόμβα; Τι είδους βόμβα είναι;","Το Προσωπικό Ιδιωτικής Ασφάλειας θα πρέπει να καταγράψει όσα ανέφερε το άτομο αυτό και να συμπληρώσει έντυπο καταγραφής βομβιστικών απειλών."],"type":"flashcard"},{"id":"Β5","question":"Εργάζεστε ως Προσωπικό Ιδιωτικής Ασφάλειας και εκτελείτε περιπολία γύρω από μια εγκατάσταση. Τι μπορεί να περιλαμβάνει ο προσωπικός εξοπλισμός που διαθέτετε;","options":["Σημειωματάριο και στυλό.","Ραδιοτηλέφωνο.","Φακό.","Σφυρίχτρα.","Κουμπί κλήσης βοήθειας."],"type":"flashcard"},{"id":"Β6","question":"Ο Α εργάζεται ως Προσωπικό Ιδιωτικής Ασφάλειας, παρέχοντας υπηρεσία φύλαξης σε αποθήκη επώνυμου Σουπερμάρκετ στην περιοχή της Αττικής κατά τις ώρες 22:00 - 06:00. Κάποια στιγμή, περί ώρα 02:00, περίπου, αντιλαμβάνεται φορτηγό αυτοκίνητο, άνευ πινακίδας και με δύο επιβαίνοντες, να εισέρχεται στον αύλειο χώρο της αποθήκης. Με την απειλή πυροβόλου όπλου αιφνιδιάζουν και ακινητοποιούν τον Α, αφαιρούν προϊόντα και αντικείμενα από την αποθήκη και στη συνέχεια τρέπονται σε φυγή. Τι αδίκημα διαπράττουν οι δράστες και ποιες είναι ορισμένες από τις ενέργειες που δύναται να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας;","options":["Οι δράστες διαπράττουν το αδίκημα της ληστείας.","Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τον προϊστάμενό του ή το Κέντρο Ελέγχου και την Ελληνική Αστυνομία.","Το Προσωπικό Ιδιωτικής Ασφάλειας παρατηρεί και καταγράφει τα χαρακτηριστικά των δραστών και οποιοδήποτε άλλο χρήσιμο στοιχείο.","Το Προσωπικό Ιδιωτικής Ασφάλειας αποφεύγει λάθη, όπως η υπερεκτίμηση των ικανοτήτων του και ο υπερβολικός ενθουσιασμός.","Το Προσωπικό Ιδιωτικής Ασφάλειας συντάσσει σχετική αναφορά και παραμένει στη διάθεση των αρμοδίων δημοσίων Αρχών."],"type":"flashcard"},{"id":"Β7","question":"Ο Α, ο οποίος ανήκει στο Προσωπικό Ιδιωτικής Ασφάλειας και απασχολείται σε Ιδιωτική Επιχείρηση Παροχής Υπηρεσιών Ασφαλείας (Ι.Ε.Π.Υ.Α.), εργάζεται σε βραδινή βάρδια εποχούμενης περιπολίας για την προστασία μίας συγκεκριμένης οικίας. Κατά την εκτέλεση των καθηκόντων του, και ενώ βρίσκεται στην βορειοανατολική πλευρά της οικίας, ενημερώνεται από το Κέντρο Λήψης Σημάτων ότι ενεργοποιήθηκε ο συναγερμός και συγκεκριμένα από σημείο που βρίσκεται στο νοτιοδυτικό άκρο αυτής. Αμέσως, μεταβαίνει στο σημείο και εντοπίζει πλησίον, αλλά εκτός του ιδιωτικού χώρου της κατοικίας, ένα άτομο, τον Β. Στη θέα του Α, ο Β απομακρύνεται από το σημείο με γρήγορο βηματισμό. Ποιες είναι ορισμένες από τις ενέργειες που δύναται να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει το Κέντρο Λήψης Σημάτων για τις διαπιστώσεις του σχετικά με το σήμα συναγερμού και για την παρουσία του Β στο σημείο.","Το Προσωπικό Ιδιωτικής Ασφάλειας οφείλει να βρίσκεται σε αυξημένη ετοιμότητα, να λάβει τα αναγκαία μέτρα αυτοπροστασίας, όντας σε θέση να κάνει χρήση όλου του εξοπλισμού του (ασύρματος, κουμπί κλήσης βοήθειας).","Το Προσωπικό Ιδιωτικής Ασφάλειας θα ελέγξει την περίμετρο του ακινήτου και τις εισόδους, αναζητώντας σημάδια παράνομης εισόδου.","Το Προσωπικό Ιδιωτικής Ασφάλειας παρατηρεί και καταγράφει τα χαρακτηριστικά του Β και οποιοδήποτε άλλο χρήσιμο στοιχείο.","Το Προσωπικό Ιδιωτικής Ασφάλειας συντάσσει σχετική αναφορά."],"type":"flashcard"},{"id":"Β8","question":"Εργάζεστε ως Προσωπικό Ιδιωτικής Ασφάλειας στην είσοδο μια πολυεθνικής εταιρείας, όπου υπάρχει εγκατεστημένο μηχάνημα X-RAY για τον έλεγχο των ατομικών αποσκευών των εισερχομένων επισκεπτών στην εγκατάσταση. Ένα άτομο, το οποίο πρόκειται να επισκεφθεί υπάλληλο της πολυεθνικής, προσέρχεται στην είσοδο και επιθυμεί να εισέλθει στο εσωτερικό της εγκατάστασης. Αμέσως, απευθύνεστε στον επισκέπτη και του ζητάτε να τοποθετήσει την τσάντα που φέρει μαζί του στο μηχάνημα X-RAY για έλεγχο. Αν το άτομο αρνηθεί τον έλεγχο, ισχυριζόμενο ότι η ενέργεια αυτή δεν είναι νομικά επιτρεπτή, πώς θα ενεργήσετε;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τον προϊστάμενό του.","Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τον υπάλληλο που πρόκειται να δεχθεί την επίσκεψη.","Το Προσωπικό Ιδιωτικής Ασφάλειας δεν διενεργεί τον έλεγχο, χωρίς την συναίνεση του επισκέπτη.","Το Προσωπικό Ιδιωτικής Ασφάλειας, δεν επιτρέπει την είσοδο στην εταιρεία, μέχρι να λάβει σχετικές οδηγίες.","Το Προσωπικό Ιδιωτικής Ασφάλειας διατηρεί την ψυχραιμία του."],"type":"flashcard"},{"id":"Β9","question":"Εργάζεστε ως Προσωπικό Ιδιωτικής Ασφάλειας και εκτελείτε απογευματινή υπηρεσία σε βιοτεχνία παραγωγής ρούχων. Είστε νέος εργαζόμενος στη βιοτεχνία, καθώς ξεκινήσατε να εργάζεστε εκεί την προηγούμενη εβδομάδα και δεν έχετε εξοικειωθεί ακόμα με τον χώρο εργασίας σας. Λόγω βλάβης σε μηχάνημα παραγωγής, προκαλείται πυρκαγιά στη βιοτεχνία που, εφόσον εξελιχθεί, θα κινδυνεύσει η ζωή των εργαζομένων. Ποιες είναι ορισμένες από τις ενέργειες που δύναται να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας απομακρύνει τους εργαζόμενους και τους επισκέπτες που, ενδεχομένως, βρίσκονται στη βιοτεχνία, εφόσον απαιτείται.","Το Προσωπικό Ιδιωτικής Ασφάλειας εκτιμά την κατάσταση, διατηρεί την ψυχραιμία του και προσπαθεί να κατασβέσει την πυρκαγιά, αν είναι εφικτό.","Το Προσωπικό Ιδιωτικής Ασφάλειας απομακρύνεται, αν η πυρκαγιά είναι μεγάλης έκτασης.","Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τον προϊστάμενο του ή το Κέντρο Ελέγχου και την Πυροσβεστική Υπηρεσία.","Το Προσωπικό Ιδιωτικής Ασφάλειας συντάσσει αναφορά για το συμβάν."],"type":"flashcard"},{"id":"Β10","question":"Είστε Προσωπικό Ιδιωτικής Ασφάλειας σε ιδιωτική κλινική κατά το ωράριο 22:00 - 06:00. Περί ώρα 23:30 διαπιστώνετε οτι ένα άτομο προβαίνει σε κλοπή ιατρικού εξοπλισμού μεγάλης αξίας από το υπόγειο της κλινικής και τον μεταφέρει σε όχημα που βρίσκεται σταθμευμένο ακριβώς έξω από την κλινική. Ποιες είναι ορισμένες από τις ενέργειες που δύναται να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας έχει δικαίωμα να συλλάβει το άτομο.","Το Προσωπικό Ιδιωτικής Ασφάλειας δεν έχει υποχρέωση να συλλάβει το άτομο.","Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τον προϊστάμενό του ή το Κέντρο Ελέγχου και την Ελληνική Αστυνομία.","Το Προσωπικό Ιδιωτικής Ασφάλειας οφείλει να δείξει αυτοσυγκράτηση και να λάβει μέτρα αυτοπροστασίας.","Το Προσωπικό Ιδιωτικής Ασφάλειας παρατηρεί και καταγράφει τα χαρακτηριστικά του ατόμου και του οχήματος και οποιοδήποτε άλλο χρήσιμο στοιχείο."],"type":"flashcard"},{"id":"Β11","question":"Είστε Προσωπικό Ιδιωτικής Ασφάλειας σε μεγάλο εμπορικό κέντρο. Στην εγκατάσταση έχει ξεσπάσει σοβαρή πυρκαγιά και έχετε λάβει οδηγίες για εκκένωση, σύμφωνα με το σχέδιο αντιμετώπισης εκτάκτου ανάγκης. Οδηγείτε ένα πλήθος είκοσι (20) ατόμων στη μοναδική έξοδο κινδύνου που μπορείτε να χρησιμοποιήσετε, προκειμένου να μη χαθούν ανθρώπινες ζωές. Στην προσπάθεια σας να ανοίξετε την έξοδο κινδύνου, διαπιστώνετε ότι ένα υπερπολυτελές αυτοκίνητο είναι σταθμευμένο εξωτερικά της εξόδου κινδύνου με αποτέλεσμα να μην είναι δυνατή η έξοδος των ατόμων. Ποιες είναι ορισμένες από τις ενέργειες που δύναται να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας; Έχετε δικαίωμα από τον νόμο να προσπαθήσετε να μετακινήσετε το αυτοκίνητο ακόμα και αν προκληθεί φθορά σε αυτό, προκειμένου να εκκενωθεί η εγκατάσταση και να σωθούν τα άτομα;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας έχει δικαίωμα, υπό προϋποθέσεις (Άρθρο 25 Π.Κ.), να μετακινήσει το αυτοκίνητο ακόμα και αν προκληθεί φθορά σε αυτό, προκειμένου να εκκενωθεί η εγκατάσταση και να σωθούν τα άτομα, καθώς πρόκειται για κατάσταση έκτακτης ανάγκης που αίρει το άδικο.","Το Προσωπικό Ιδιωτικής Ασφάλειας συντάσσει σχετική αναφορά.","Το Προσωπικό Ιδιωτικής Ασφάλειας ενεργεί με γνώμονα τη διαφύλαξη της ζωής και της σωματικής ακεραιότητας του, όσο και της ζωής και της σωματικής ακεραιότητας των συναδέλφων του, καθώς και των υπολοίπων πολιτών.","Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τον προϊστάμενό του ή το Κέντρο Ελέγχου και την Πυροσβεστική Υπηρεσία.","Το Προσωπικό Ιδιωτικής Ασφάλειας διατηρεί την ψυχραιμία του και αποφεύγει τον πανικό."],"type":"flashcard"},{"id":"Β12","question":"Είστε Προσωπικό Ιδιωτικής Ασφάλειας και εκτελείτε καθήκοντα φύλαξης με όχημα περιπολίας, προκειμένου να ελέγχετε σε περιοδικά χρονικά διαστήματα τις ακόλουθες εγκαταστάσεις: -Ένα κοσμηματοπωλείο. -Ένα κατάστημα ρούχων. -Την οικία του Πρέσβη ευρωπαϊκής χώρας στην Ελλάδα. Διερχόμενος από την οικία του Πρέσβη παρατηρείτε ένα αυτοκίνητο, με δύο (2) άτομα εντός αυτού, να έχει σταματήσει και να φωτογραφίζει την οικία. Ποιες είναι ορισμένες από τις ενέργειες που δύναται να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας παρατηρεί και καταγράφει τα χαρακτηριστικά των ατόμων και του οχήματος.","Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τον προϊστάμενό του ή το Κέντρο Ελέγχου και την Ελληνική Αστυνομία και ζητά τη συνδρομή άλλων συναδέλφων του, εφόσον απαιτείται.","Το Προσωπικό Ιδιωτικής Ασφάλειας είναι σε αυξημένη ετοιμότητα διατηρώντας ασφαλή απόσταση.","Το Προσωπικό Ιδιωτικής Ασφάλειας είναι σε θέση να κάνει χρήση όλου του εξοπλισμού του (π.χ. ασύρματος).","Το Προσωπικό Ιδιωτικής Ασφάλειας ενεργεί με γνώμονα τη διαφύλαξη της ζωής και της σωματικής ακεραιότητας του, όσο και της ζωής και της σωματικής ακεραιότητας των συναδέλφων του, καθώς και των υπολοίπων πολιτών."],"type":"flashcard"},{"id":"Β13","question":"Είστε Προσωπικό Ιδιωτικής Ασφάλειας σε υποκατάστημα τράπεζας, τέλη του μήνα, διάστημα πληρωμής συντάξεων και βρίσκεστε στο εσωτερικό αυτού. Ξαφνικά, τρεις (3) δράστες, με αλλοιωμένα τα χαρακτηριστικά των προσώπων τους (φορώντας κουκούλες) και κρατώντας βαρύ οπλισμό (3 τυφέκια Kalashnikov), εισέρχονται εντός της τράπεζας, φωνάζοντας ληστεία, ενώ ταυτόχρονα πυροβολούν μια φορά στον αέρα. Ποιες είναι ορισμένες από τις ενέργειες που δύναται να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας μετά την αποχώρηση των δραστών;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τον προϊστάμενό του και την Ελληνική Αστυνομία για στοιχεία όπως ο αριθμός των δραστών, η κατεύθυνση και ο τρόπος διαφυγής τους, τα χαρακτηριστικά των δραστών (π.χ. σωματική διάπλαση, ομιλία, τρόπος βάδισης).","Το Προσωπικό Ιδιωτικής Ασφάλειας, αν διαπιστώσει οτι υπάρχουν τραυματίες, καλεί το Ε.Κ.Α.Β..","Το Προσωπικό Ιδιωτικής Ασφάλειας αποκλείει τον χώρο του εγκλήματος για τη διαφύλαξη πειστηρίων και ιχνών.","Το Προσωπικό Ιδιωτικής Ασφάλειας αναζητά και καταγράφει στοιχεία μαρτύρων.","Το Προσωπικό Ιδιωτικής Ασφάλειας απομακρύνει αναρμόδια άτομα (περιοίκους, περαστικούς, κ.λπ.) εκτός της ζώνης αποκλεισμού και απαγορεύει την πρόσβαση στον χώρο σε μη εξουσιοδοτημένα άτομα, εκτός αν τίθεται θέμα διάσωσης ανθρώπινης ζωής."],"type":"flashcard"},{"id":"Β14","question":"Είστε Προσωπικό Ιδιωτικής Ασφάλειας σε δημόσια Υπηρεσία. Κατά τη διάρκεια της υπηρεσίας σας, και ενώ ο οργανισμός είναι ανοιχτός για το κοινό, συντελείται ισχυρός σεισμός, όπου μεταξύ άλλων προκαλεί ζημιές και καταρρεύσεις σε κάποια σημεία του κτηρίου. Ποιες οι βασικές ενέργειές σας κατά τη διάρκεια του σεισμικού φαινομένου και μετά τον σεισμό;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας διατηρεί την ψυχραιμία του κατά τη διάρκεια του σεισμού.","Το Προσωπικό Ιδιωτικής Ασφάλειας καλύπτεται κάτω από ανθεκτικό έπιπλο κατά τη διάρκεια του σεισμού.","Το Προσωπικό Ιδιωτικής Ασφάλειας, μετά τον σεισμό, ενημερώνει την Ελληνική Αστυνομία, την Πυροσβεστική Υπηρεσία και το Ε.Κ.Α.Β., εφόσον απαιτείται.","Το Προσωπικό Ιδιωτικής Ασφάλειας καταφεύγει σε ανοιχτό χώρο, μετά τον σεισμό.","Το Προσωπικό Ιδιωτικής Ασφάλειας, μετά τον σεισμό, απομακρύνεται από το κτήριο μέσω του κλιμακοστασίου και όχι με τη χρήση ανελκυστήρα."],"type":"flashcard"},{"id":"Β15","question":"Είστε Προσωπικό Ιδιωτικής Ασφάλειας στις εγκαταστάσεις μεγάλης ιδιωτικής επιχείρησης. Ξεσπά πυρκαγιά στον χώρο υποδοχής του κτηρίου, την οποία την αντιλαμβάνεστε αμέσως, μόλις εκδηλώνεται. Προσπαθείτε με τη χρήση του κατάλληλου πυροσβεστήρα να την αντιμετωπίσετε στο αρχικό της στάδιο, προκειμένου να μην επεκταθεί. Ποιες είναι ορισμένες από τις ενέργειες που δύναται να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας και ποιος είναι ένας τύπος πυροσβεστήρα/ων που είναι κατάλληλος/οι για να κατασβήσουν στερεές καύσιμες ύλες που καίγονται στην εγκατάσταση (π.χ. ξυλεία, χαρτικά, πλαστικά-ελαστικά);","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας μπορεί να χρησιμοποιήσει πυροσβεστήρα ξηράς σκόνης.","Το Προσωπικό Ιδιωτικής Ασφάλειας, εφόσον το συμβάν κλιμακωθεί ταχύτατα, μπορεί να ενεργοποιήσει το χειροκίνητο σύστημα συναγερμού πυρκαγιάς.","Το Προσωπικό Ιδιωτικής Ασφάλειας εκτιμά την κατάσταση και ενεργεί πάντοτε με γνώμονα την ασφάλειά του.","Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τον προϊστάμενό του ή το Κέντρο Ελέγχου και την Πυροσβεστική Υπηρεσία (στα τηλέφωνα 199 ή 112) και παρέχει τις κατά το δυνατόν ακριβέστερες πληροφορίες.","Το Προσωπικό Ιδιωτικής Ασφάλειας απομακρύνεται από τον χώρο, αν το συμβάν δεν ελεγχθεί πλήρως ή κριθεί πως δεν είναι ασφαλής η προσπάθεια κατάσβεσης."],"type":"flashcard"},{"id":"Β16","question":"Είστε Προσωπικό Ιδιωτικής Ασφάλειας, με καθήκοντα στατικής φύλαξης σε εγκατάσταση εργοστασίου παρασκευής τυποποιημένων τροφίμων. Μαζί σας εκτελεί υπηρεσία και έτερος συνάδελφός σας. Ξαφνικά, αντιλαμβάνεστε ένα άτομο στο πεδίο ευθύνης σας και συγκεκριμένα στο εσωτερικό της εγκατάστασης. Καλείτε το άτομο να σταματήσει, για να προχωρήσετε σε ερωτήσεις. Το άτομο προσπαθεί να αποφύγει τις ερωτήσεις σας και στη συνέχεια υβρίζει και δεν ακολουθεί τις οδηγίες σας: Ποιες θα είναι οι βασικές ενέργειες σας, σε συνεργασία με τον συνάδελφο, σε σχέση με τη διαχείριση του συγκεκριμένου περιστατικού;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας κατά την προσέγγιση του ατόμου, διατηρεί ασφαλή απόσταση και εφαρμόζει την τεχνική της ορθής γωνίας.","Το Προσωπικό Ιδιωτικής Ασφάλειας διατηρεί την ψυχραιμία του.","Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τον προϊστάμενό του ή το Κέντρο Ελέγχου και την Ελληνική Αστυνομία και ζητά τη συνδρομή άλλων συναδέλφων του, εφόσον απαιτείται.","Το Προσωπικό Ιδιωτικής Ασφάλειας παρατηρεί και καταγράφει στοιχεία του ατόμου.","Το Προσωπικό Ιδιωτικής Ασφάλειας δίνει ιδιαίτερη προσοχή στα χέρια του ατόμου και δεν στρέφει την πλάτη του σε αυτό."],"type":"flashcard"},{"id":"Β17","question":"Είστε Προσωπικό Ιδιωτικής Ασφάλειας, με καθήκοντα στατικής φύλαξης, σε πολυώροφο κτήριο ενός μαιευτηρίου. Ξαφνικά διαπιστώνετε ότι έχει διακοπεί η παροχή ηλεκτρικής ενέργειας στο κτήριο, αποτέλεσμα της οποίας είναι να εγκλωβιστούν άτομα, εργαζόμενοι και επισκέπτες, εντός του ανελκυστήρα τα οποία πανικοβάλλονται και καλούν σε βοήθεια, φωνάζοντας έντονα ότι νιώθουν ασφυξία. Ποιες είναι ορισμένες από τις ενέργειες που δύναται να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τα εγκλωβισμένα άτομα οτι 17 υπάρχει συνεχής ροή αέρα.","Το Προσωπικό Ιδιωτικής Ασφάλειας ενημερώνει τον προϊστάμενό του ή το Κέντρο Ελέγχου και την Πυροσβεστική Υπηρεσία.","Το Προσωπικό Ιδιωτικής Ασφάλειας ζητά από τα εγκλωβισμένα άτομα να διατηρήσουν την ψυχραιμία τους.","Το Προσωπικό Ιδιωτικής Ασφάλειας επικοινωνεί με τα εγκλωβισμένα άτομα, και συλλέγει πληροφορίες π.χ. πόσος είναι ο αριθμός των εγκλωβισμένων.","Το Προσωπικό Ιδιωτικής Ασφάλειας δεν προσπαθεί να ανοίξει τη θύρα του ανελκυστήρα, γιατί υπάρχει κίνδυνος τραυματισμού των εγκλωβισμένων ατόμων."],"type":"flashcard"},{"id":"Β18","question":"Προσωπικό Ιδιωτικής Ασφάλειας (Α και Β) εκτελεί μεταφορά χρημάτων από το κεντρικό κατάστημα της τράπεζας σε ένα μικρότερο περιφερειακό κατάστημα στην ίδια πόλη. Το ανωτέρω προσωπικό, πέραν του εξοπλισμού του, επιτρέπεται να οπλοφορεί και η εταιρεία στην οποία εργάζεται έχει σχετικές άδειες οπλοκατοχής. Μετά τη λήξη της υπηρεσίας του ο Α, επειδή και την επομένη ημέρα θα εκτελούσε μεταφορά χρημάτων, συνεννοήθηκε τηλεφωνικά με τον Γ, ο οποίος είναι ο νόμιμος κάτοχος του οπλισμού της Ι.Ε.Π.Υ.Α. στην οποία εργάζονται οι Α και Β, να κρατήσει το όπλο στην οικία του. Ποιες είναι οι νόμιμες ενέργειες που δύναται να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας (Α και Β) παραλαμβάνει το όπλο κατά την ανάληψη της υπηρεσίας του.","Το Προσωπικό Ιδιωτικής Ασφάλειας (Α και Β) οφείλει να παραδώσει το όπλο στον Γ αμέσως μετά τη λήξη της υπηρεσίας.","Τα όπλα πρέπει να φυλάσσονται με ευθύνη του Γ σε ειδικό, προς τούτο, χώρο της επιχείρησης.","Το Προσωπικό Ιδιωτικής Ασφάλειας (Α και Β) πρέπει να διαθέτει άδεια οπλοφορίας.","Για την παράδοση και παραλαβή του οπλισμού τηρείται ειδικό βιβλίο χρέωσης και αποχρέωσης οπλισμού."],"type":"flashcard"},{"id":"Β19","question":"Ο Α εργάζεται ως Προσωπικό Ιδιωτικής Ασφάλειας σε αγώνα καλαθοσφαίρισης και έχει οριστεί να πραγματοποιεί έλεγχο προσερχόμενων φιλάθλων σε θύρα της αθλητικής εγκατάστασης. Κατά τη διάρκεια της σωματικής έρευνας, ο Π, προσερχόμενος φίλαθλος, αντιδρά λέγοντας στον Α ότι η διαδικασία αυτή είναι παράνομη και τον απειλεί αρνούμενος οποιονδήποτε έλεγχο. Υπό ποιες προυποθέσεις διενεργείται ο έλεγχος και ποιες είναι οι νόμιμες ενέργειες που δύναται να προβεί το Προσωπικό Ιδιωτικής Ασφάλειας;","options":["Ο υποχρεωτικός σωματικός έλεγχος διενεργείται από την ΕΛ.ΑΣ..","Ο έλεγχος του φιλάθλου από Προσωπικό Ιδιωτικής Ασφάλειας μπορεί να πραγματοποιηθεί μόνο κατόπιν συναίνεσης του φιλάθλου.","Ο έλεγχος μπορεί να πραγματοποιηθεί από Προσωπικό Ιδιωτικής Ασφάλειας του ιδίου φύλου.","Εφόσον ο φίλαθλος αρνηθεί τον σωματικό έλεγχο στην Αστυνομική Αρχή τότε η Αστυνομική Αρχή ή το Προσωπικό Ιδιωτικής Ασφάλειας δικαιούται να του απαγορεύσει την είσοδο.","Το Προσωπικό Ιδιωτικής Ασφάλειας επιδεικνύει κόσμια συμπεριφορά, στον προσερχόμενο φίλαθλο."],"type":"flashcard"},{"id":"Β20","question":"Είστε χειριστής στο Κέντρο Λήψης Σημάτων μιας Ι.Ε.Π.Υ.Α. στην οποία εργάζεστε. Κατά την εκτέλεση της υπηρεσίας σας στο Κέντρο Λήψης Σημάτων λαμβάνετε σήμα συναγερμού από μια οικία που φυλάσσεται από την Ι.Ε.Π.Υ.Α. στην οποία εργάζεστε. Ποιες είναι ορισμένες από τις ενέργειες που δύναται να προβεί ο χειριστής του Κέντρου Λήψης Σημάτων;","options":["Επαληθεύει το σήμα συναγερμού.","Οργανώνει και συντονίζει τις ενέργειες του Προσωπικού Ιδιωτικής Ασφάλειας που ενδεχομένως εκτελεί στατική φύλαξη στην οικία ή των εποχούμενων φυλάξεων στον τομέα ευθύνης των οποίων ανήκει η οικία.","Ενημερώνει τις αρμόδιες δημόσιες Αρχές (ΕΛ.ΑΣ., Πυροσβεστική Υπηρεσία).","Ενημερώνει το πρόσωπο στο οποίο παρέχονται οι υπηρεσίες φύλαξης.","Καταγράφει όλα τα συμβάντα και στοιχεία, όπως η ημερομηνία, η ώρα και ο τόπος του συμβάντος."],"type":"flashcard"},{"id":"Β21","question":"Εργάζεστε ως Προσωπικό Ιδιωτικής Ασφάλειας, παρέχοντας υπηρεσίες προστασίας φυσικών προσώπων. Το φυσικό πρόσωπο που συνοδεύετε, αποφασίζει να μετακινηθεί πεζό προς ένα σημείο. Ποιοι είναι ορισμένοι κανόνες που πρέπει να τηρεί το Προσωπικό Ιδιωτικής Ασφάλειας, ως μέλος της Συνοδευτικής Ομάδας Ασφαλείας του προστατευόμενου προσώπου;","options":["Το Προσωπικό Ιδιωτικής Ασφάλειας να βρίσκεται σε συνεχή επαγρύπνηση.","Το Προσωπικό Ιδιωτικής Ασφάλεια παρατηρεί οτιδήποτε συμβαίνει γύρω από το προστατευόμενο πρόσωπο.","Το Προσωπικό Ιδιωτικής Ασφάλειας δεν εγκαταλείπει για οποιοδήποτε λόγο την περιοχή ευθύνης γύρω από το προστατευόμενο πρόσωπο.","Στην περίπτωση ενός περιστατικού το οποίο ενέχει κίνδυνο, το Προσωπικό Ιδιωτικής Ασφάλειας πρέπει πρώτα από όλα να καλύψει το προστατευόμενο πρόσωπο, δημιουργώντας μία ασπίδα γύρω του.","Στην περίπτωση ενός περιστατικού το οποίο ενέχει κίνδυνο, τα μέλη της Συνοδευτικής Ομάδας Ασφάλειας πρέπει να φυγαδεύσουν άμεσα το προστατευόμενο πρόσωπο προς μία ασφαλή τοποθεσία."],"type":"flashcard"}];

// ── State ────────────────────────────────────────────────────────────────────
let phase = 'intro';
let theorQueue  = []; // 20 selected theoretical questions
let practQueue  = []; // 2 selected practical questions
let curIdx      = 0;
let answers     = new Array(20).fill(null); // null | optionIndex
let selectedOpt = null; // pending selection
let timer       = 3600;
let timerInt    = null;
let practShuffled  = []; // shuffled options per practical question
let practSelected  = [{}, {}]; // {optIdx: bool} per question
let practSubmitted = [false, false];
let partAScore  = 0;
let partBScores = [0, 0];
let savedResult = false;

// ── Utilities ─────────────────────────────────────────────────────────────────
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

// ── Timer ─────────────────────────────────────────────────────────────────────
function startTimer(){
  timer=3600; updateTimer();
  timerInt=setInterval(()=>{timer--;updateTimer();if(timer<=0){clearInterval(timerInt);autoFinishPartA();}},1000);
}
function updateTimer(){
  const d=document.getElementById('timer-display');
  const f=document.getElementById('timer-fill');
  if(d){d.textContent=fmt(timer);d.className=timer<=600?'warn':'';}
  if(f){f.style.width=(timer/3600*100)+'%';f.className=timer<=600?'timer-fill warn':'timer-fill';}
}
function autoFinishPartA(){finishPartA(true);}

function finishPartA(byTimer=false){
  clearInterval(timerInt);
  partAScore=0;
  for(let i=0;i<20;i++){
    if(answers[i]!==null && answers[i]===theorQueue[i].correct) partAScore++;
  }
  phase='partB';
  curIdx=0;
  // Init practical data
  practShuffled=[];
  practSelected=[{},{}];
  practSubmitted=[false,false];
  for(let i=0;i<2;i++){
    const q=practQueue[i];
    const wrong=practicalWrong[q.id]||['Καμία από τις παραπάνω επιλογές.','Ανεξαρτήτως των ανωτέρω.'];
    practShuffled.push(shuffle([...q.options,...wrong]));
  }
  document.getElementById('timer-bar').style.display='none';
  document.getElementById('prog-bar-wrap').style.display='none';
  document.getElementById('phase-badge').textContent='Μέρος Β';
  document.getElementById('sim-header').className='sim-header';
  document.getElementById('content-wrap').className='wrap';
  render();
}

// ── Actions (exposed to inline onclick) ──────────────────────────────────────
window.startTest=function(){
  theorQueue=shuffle([...questions]).slice(0,20);
  practQueue=shuffle([...practicalQuestions]).slice(0,2);
  curIdx=0;
  answers=new Array(20).fill(null);
  selectedOpt=null;
  partAScore=0;partBScores=[0,0];savedResult=false;
  phase='partA';
  document.getElementById('timer-bar').style.display='flex';
  document.getElementById('prog-bar-wrap').style.display='flex';
  document.getElementById('phase-badge').textContent='Μέρος Α';
  document.getElementById('sim-header').className='sim-header with-timer';
  document.getElementById('content-wrap').className='wrap timer-offset';
  startTimer();render();
};

window.selectOpt=function(i){
  if(answers[curIdx]!==null)return;
  selectedOpt=i;render();
};

window.confirmAnswer=function(){
  if(selectedOpt===null)return;
  answers[curIdx]=selectedOpt;
  selectedOpt=null;
  if(curIdx<19){curIdx++;render();}else{finishPartA();}
};

window.skipQuestion=function(){
  answers[curIdx]=null; // stays null = unanswered
  selectedOpt=null;
  if(curIdx<19){curIdx++;render();}else{finishPartA();}
};

window.togglePractical=function(pIdx,optIdx){
  if(practSubmitted[pIdx])return;
  if(practSelected[pIdx][optIdx]){delete practSelected[pIdx][optIdx];}
  else{practSelected[pIdx][optIdx]=true;}
  render();
};

window.submitPractical=function(pIdx){
  if(practSubmitted[pIdx])return;
  practSubmitted[pIdx]=true;
  const q=practQueue[pIdx];
  const shuffled=practShuffled[pIdx];
  let correctSel=0, wrongSel=0;
  for(const [k,v] of Object.entries(practSelected[pIdx])){
    if(!v)continue;
    const txt=shuffled[parseInt(k)];
    if(q.options.includes(txt)) correctSel++;
    else wrongSel++;
  }
  const N=q.options.length;
  const raw=(correctSel/N)*10;
  const pen=wrongSel*2;
  partBScores[pIdx]=Math.max(0,Math.round(raw-pen));
  render();
};

window.nextPractical=function(){
  if(curIdx===0){curIdx=1;render();}
  else{showResults();}
};

window.goHome=function(){
  if(phase==='partA'||phase==='partB'){
    if(!confirm('Αποχώρηση από το τεστ; Η πρόοδός σου θα χαθεί.'))return;
  }
  window.location.href='home.html';
};

window.restartTest=function(){
  phase='intro';
  clearInterval(timerInt);
  document.getElementById('timer-bar').style.display='none';
  document.getElementById('prog-bar-wrap').style.display='none';
  document.getElementById('phase-badge').textContent='Έναρξη';
  document.getElementById('sim-header').className='sim-header';
  document.getElementById('content-wrap').className='wrap';
  render();
};

// ── Results ───────────────────────────────────────────────────────────────────
async function showResults(){
  phase='results';
  const partB=partBScores[0]+partBScores[1];
  const avg=(partAScore+partB)/2;
  const passed=avg>=10;
  document.getElementById('phase-badge').textContent='Αποτελέσματα';
  if(!savedResult){
    savedResult=true;
    try{
      await addDoc(collection(db,'simulationResults'),{
        uid:userId, email:userEmail, completedAt:serverTimestamp(),
        partAScore, partBScore:partB,
        partBQ1Score:partBScores[0], partBQ2Score:partBScores[1],
        average:Math.round(avg*10)/10, passed,
        theoreticalIds:theorQueue.map(q=>q.id),
        practicalIds:practQueue.map(q=>q.id)
      });
    }catch(e){console.error('Firebase save error:',e);}
  }
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────
function render(){
  const el=document.getElementById('content');
  if(phase==='intro')     el.innerHTML=renderIntro();
  else if(phase==='partA')el.innerHTML=renderPartA();
  else if(phase==='partB')el.innerHTML=renderPartB();
  else if(phase==='results')el.innerHTML=renderResults();
}

// ── Render: Part A ────────────────────────────────────────────────────────────
function renderPartA(){
  const q=theorQueue[curIdx];
  const letters=['Α','Β','Γ','Δ','Ε','ΣΤ'];
  const pct=((curIdx+1)/20*100).toFixed(0);
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-text').textContent=(curIdx+1)+' / 20';

  const optsHtml=q.options.map((opt,i)=>{
    let cls='opt';
    if(i===selectedOpt) cls+=' selected';
    return `<button class="${cls}" onclick="selectOpt(${i})">
      <span class="opt-letter">${letters[i]}</span>
      <span class="opt-text">${opt}</span>
    </button>`;
  }).join('');

  return `
  <div style="margin-top:1.5rem">
    <div class="q-card">
      <span class="q-part-label">🅐 Θεωρητικό Μέρος</span>
      <div class="q-num">Ερώτηση ${q.id} &nbsp;·&nbsp; ${curIdx+1} από 20</div>
      <div class="q-text">${q.question}</div>
      <div class="options">${optsHtml}</div>
      <div class="action-row">
        <button class="btn-confirm" ${selectedOpt===null?'disabled':''} onclick="confirmAnswer()">✓ Επιβεβαίωση Απάντησης</button>
        <button class="btn-skip" onclick="skipQuestion()">↷ Παράλειψη</button>
      </div>
    </div>
    <div style="text-align:center;margin-top:1rem;font-size:0.72rem;color:var(--text3);">
      ${answers.filter(a=>a!==null).length} απαντημένες · ${answers.filter(a=>a===null).length} εκκρεμείς
    </div>
  </div>`;
}

// ── Render: Part B ────────────────────────────────────────────────────────────
function renderPartB(){
  const q=practQueue[curIdx];
  const shuffled=practShuffled[curIdx];
  const submitted=practSubmitted[curIdx];
  const selected=practSelected[curIdx];

  const optsHtml=shuffled.map((opt,i)=>{
    const isSelected=!!selected[i];
    const isCorrect=q.options.includes(opt);
    let cls='chk-opt';
    if(submitted){
      cls+=' chk-disabled';
      if(isCorrect) cls+=' chk-correct';
      else if(isSelected) cls+=' chk-wrong';
    } else {
      if(isSelected) cls+=' chk-selected';
    }
    const check=submitted?(isCorrect?'✓':(isSelected?'✗':'')):(isSelected?'✓':'');
    return `<button class="${cls}" onclick="togglePractical(${curIdx},${i})">
      <span class="chk-box">${check}</span>
      <span class="chk-text">${opt}</span>
    </button>`;
  }).join('');

  const selCount=Object.values(selected).filter(Boolean).length;
  const scoreHtml=submitted?`
    <div class="score-reveal">
      <div class="score-num">${partBScores[curIdx]}/10</div>
      <div class="score-detail">
        <strong>Σενάριο ${curIdx+1} — Βαθμός: ${partBScores[curIdx]}/10</strong><br>
        Σωστές επιλογές: ${q.options.filter(o=>shuffled.some((s,i)=>s===o&&selected[shuffled.indexOf(o)])).length}/${q.options.length}<br>
        ${Object.entries(selected).filter(([,v])=>v).filter(([k])=>!q.options.includes(shuffled[parseInt(k)])).length>0?'⚠️ Επιλέχθηκαν λανθασμένες απαντήσεις':'✓ Καμία λανθασμένη επιλογή'}
      </div>
    </div>
    ${curIdx===0
      ? `<button class="btn-next" onclick="nextPractical()">Επόμενο Σενάριο →</button>`
      : `<button class="btn-next" onclick="nextPractical()">Δείτε Αποτελέσματα 🏁</button>`}
  `:(!submitted&&selCount>0?`<button class="btn-submit" onclick="submitPractical(${curIdx})">✓ Υποβολή Απαντήσεων</button>`:`<button class="btn-submit" disabled>Επιλέξτε τουλάχιστον μία απάντηση</button>`);

  return `
  <div style="margin-top:1.5rem">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.875rem;">
      <span style="font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--text3);">🅑 Πρακτικό Μέρος</span>
      <span style="font-size:0.78rem;font-weight:700;color:var(--gold);">Σενάριο ${curIdx+1} / 2</span>
    </div>
    <div class="scenario-card">
      <div class="scenario-header">${q.id} — Σενάριο Πρακτικής Εξέτασης</div>
      <div class="scenario-text">${q.question}</div>
    </div>
    <div class="q-card">
      <div class="q-num" style="margin-bottom:0.75rem;">Επιλέξτε όλες τις σωστές απαντήσεις:</div>
      <div class="checkbox-list">${optsHtml}</div>
      ${scoreHtml}
    </div>
  </div>`;
}

function renderResults(){

  const passed=avg>=10;
  const icon=passed?(avg>=16?'🏆':'✅'):'📚';
  const msg=passed
    ?(avg>=16?'Εξαιρετική επίδοση! Είσαι έτοιμος για την εξέταση.':'Καλή επίδοση! Συνέχισε την εξάσκηση.')
    :'Χρειάζεσαι περισσότερη εξάσκηση. Μην τα παρατάς!';
  const aColor=partAScore>=14?'var(--green)':partAScore>=10?'var(--gold)':'var(--red)';
  const bColor=partB>=14?'var(--green)':partB>=10?'var(--gold)':'var(--red)';
  const avgColor=passed?'var(--green)':'var(--red)';

  return `
  <div class="results-card">
    <div class="res-icon">${icon}</div>
    <div class="res-title">Αποτελέσματα Προσομοίωσης</div>
    <div class="pass-badge ${passed?'pass':'fail'}">${passed?'✓ ΕΠΙΤΥΧΙΑ':'✗ ΑΠΟΤΥΧΙΑ'}</div>

    <div class="res-grid">
      <div class="res-box">
        <div class="res-val" style="color:${aColor}">${partAScore}<span style="font-size:0.9rem;color:var(--text3)">/20</span></div>
        <div class="res-lbl">Μέρος Α<br>Θεωρητικό</div>
      </div>
      <div class="res-box">
        <div class="res-val" style="color:${bColor}">${partB}<span style="font-size:0.9rem;color:var(--text3)">/20</span></div>
        <div class="res-lbl">Μέρος Β<br>Πρακτικό</div>
      </div>
      <div class="res-box">
        <div class="res-val" style="color:${avgColor}">${avg.toFixed(1)}</div>
        <div class="res-lbl">Μέσος<br>Όρος</div>
      </div>
    </div>

    <div class="part-detail">
      <div class="part-detail-title">Ανάλυση Βαθμολογίας</div>
      <div class="part-row"><span>Μέρος Α — Θεωρητικό (${partAScore} σωστές/20)</span><span class="val" style="color:${aColor}">${partAScore}/20</span></div>
      <div class="part-row"><span>Μέρος Β — Σενάριο 1</span><span class="val">${partBScores[0]}/10</span></div>
      <div class="part-row"><span>Μέρος Β — Σενάριο 2</span><span class="val">${partBScores[1]}/10</span></div>
      <div class="part-row" style="border-top:1px solid var(--border2);padding-top:0.5rem;margin-top:0.25rem;">
        <span><strong>Μέσος Όρος (Α+Β)/2</strong></span>
        <span class="val" style="color:${avgColor}">${avg.toFixed(1)} ${passed?'✓':'✗'}</span>
      </div>
    </div>

    <div class="res-note">${msg}<br>
      ${!passed?'<span style="color:var(--text3);font-size:0.75rem;">Για επιτυχία απαιτείται μέσος όρος ≥ 10/20</span>':''}
    </div>

    <div class="res-actions">
      <button class="btn-again" onclick="restartTest()">🔄 Νέο Τεστ</button>
      <a href="home.html" class="btn-home-res">🏠 Αρχική</a>
      <a href="quiz.html" class="btn-home-res">📚 Εξάσκηση</a>
    </div>
  </div>`;
}

// Initial render
render();
</script>
</body>
</html>
